name: Security Audit

on:
  # Run weekly every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"
  # Allow manual trigger
  workflow_dispatch:
  # Run on any dependency file changes
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (high & critical only)
        # Exit code 1 = vulnerabilities found at the given level
        run: npm audit --audit-level=high --json > audit-report.json || true

      - name: Parse audit results and fail on high/critical
        run: |
          HIGH=$(cat audit-report.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const vuln = d.metadata?.vulnerabilities ?? {};
            console.log((vuln.high || 0) + (vuln.critical || 0));
          ")
          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "❌ Found $HIGH high or critical vulnerabilities."
            cat audit-report.json | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              Object.values(d.vulnerabilities || {})
                .filter(v => ['high','critical'].includes(v.severity))
                .forEach(v => console.log(\`  [\${v.severity.toUpperCase()}] \${v.name}: \${v.title}\`));
            "
            exit 1
          fi
          echo "✅ No high or critical vulnerabilities found."

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            // Check for existing open security issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "security",
              state: "open",
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security vulnerabilities detected — ${date}`,
                body: [
                  "The weekly npm audit found **high or critical** vulnerabilities.",
                  "",
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  "",
                  "**Steps to fix:**",
                  "1. Run `npm audit` locally to see full details",
                  "2. Run `npm audit fix` for automatic fixes",
                  "3. For breaking fixes: `npm audit fix --force` (review changes carefully)",
                  "4. Update any unmaintained packages manually",
                ].join("\n"),
                labels: ["security", "dependencies"],
              });
            }
